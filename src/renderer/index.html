<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>raibitScoreboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">

  <!-- 관중용 스코어보드 (Main.dc.html) -->
  <div id="main" class="screen"></div>

  <!-- 관리자 화면 (Admin.dc.html) -->
  <div id="admin" class="screen" hidden>
    <div id="app-version" style="position: absolute; right: 56px; bottom: 12px; font-size: 20px; color: #8E7770; pointer-events: none"></div>
    <div style="display: flex; align-items: center; gap: 20px">
      <h1 style="margin: 0; font-size: 52px; font-weight: 400; color: #FFB21E; text-shadow: 0 0 14px rgba(255,178,30,0.5)">관리자 모드</h1>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; font-size: 22px; color: #B8A29B">
        <div>관중 화면은 이 창이 닫히면 다시 보입니다</div>
        <div style="font-size: 19px">열기 <span id="shortcut" style="color: #E9DAD5"></span> · 닫기 <span style="color: #E9DAD5">Esc</span> · 전체화면 전환 <span id="fs-shortcut" style="color: #E9DAD5"></span></div>
      </div>
      <button type="button" id="btn-fullscreen" style="height: 52px; padding: 0 22px; border-radius: 14px; border: 2px solid #5A3A33; background: transparent; color: #F3E6E1; font-family: inherit; font-size: 24px; cursor: pointer"></button>
      <button type="button" id="btn-close" style="height: 52px; padding: 0 26px; border-radius: 14px; border: 2px solid #5A3A33; background: transparent; color: #F3E6E1; font-family: inherit; font-size: 24px; cursor: pointer">스코어보드로 돌아가기</button>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: flex; gap: 32px">

      <div style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 28px 32px; border-radius: 24px; background: #1C0F0D; border: 1px solid #3A2420; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: center; gap: 16px">
          <h2 id="records-title" style="margin: 0; font-size: 36px; font-weight: 400; white-space: nowrap">명예의 전당</h2>
          <div id="pending" style="flex-grow: 1; font-size: 22px; color: #FFB21E; white-space: nowrap"></div>
          <button type="button" id="btn-toggle-records" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 2px solid #FFB21E; background: transparent; color: #FFB21E; font-family: inherit; font-size: 21px; cursor: pointer; white-space: nowrap">전체 기록 보기</button>
        </div>
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 128px 112px 48px; gap: 12px; padding: 0 15px; font-size: 20px; color: #B8A29B">
          <div>순위</div><div>이름</div><div>점수</div><div>일시</div><div></div>
        </div>
        <div id="rows" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px"></div>
        <div style="flex: none; display: flex; align-items: center; gap: 16px">
          <div id="names-msg" style="flex-grow: 1; min-width: 0; font-size: 19px; color: #B8A29B">이름·점수를 고친 뒤 저장하세요.</div>
          <button type="button" id="btn-reset-records" style="flex: none; height: 56px; padding: 0 22px; border-radius: 14px; border: 2px solid #FF8A7A; background: transparent; color: #FF8A7A; font-family: inherit; font-size: 22px; cursor: pointer; white-space: nowrap">기록 전체 삭제</button>
          <button type="button" id="btn-save-names" style="flex: none; white-space: nowrap; height: 56px; padding: 0 30px; border-radius: 14px; border: 0; background: #FFB21E; color: #1A0D0B; font-family: inherit; font-size: 26px; cursor: pointer; box-shadow: 0 0 22px rgba(255,178,30,0.45)">변경 저장</button>
        </div>
      </div>

      <div style="width: 480px; flex: none; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto">

        <div style="box-sizing: border-box; padding: 14px 22px; border-radius: 24px; background: #1C0F0D; border: 1px solid #3A2420; display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-size: 28px; font-weight: 400">경기 제어</h2>
          <div style="font-size: 22px; color: #C9B3AC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">현재 상태: <span id="state-text"></span></div>
          <button type="button" id="btn-start" title="START 버튼과 같습니다" style="height: 56px; flex: none; border-radius: 16px; border: 0; background: #FF4A1C; color: #1A0D0B; font-family: inherit; font-size: 30px; cursor: pointer; box-shadow: 0 0 26px rgba(255,74,28,0.5)">측정 시작</button>
          <button type="button" id="btn-stop" title="중지하면 기록이 남지 않습니다" style="height: 42px; flex: none; border-radius: 16px; border: 2px solid #FF8A7A; background: transparent; color: #FF8A7A; font-family: inherit; font-size: 24px; cursor: pointer">측정 중지 · 기록하지 않음</button>
        </div>

        <div style="box-sizing: border-box; padding: 14px 22px; border-radius: 24px; background: #1C0F0D; border: 1px solid #3A2420; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 12px">
            <h2 style="margin: 0; font-size: 28px; font-weight: 400; flex-grow: 1">장치 연결</h2>
            <button type="button" id="btn-reconnect" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 2px solid #5A3A33; background: transparent; color: #F3E6E1; font-family: inherit; font-size: 20px; cursor: pointer">포트 다시 연결</button>
          </div>
          <div id="ports" style="display: flex; flex-direction: column; gap: 8px"></div>
          <div id="open-ports" style="display: flex; flex-direction: column; gap: 6px"></div>
        </div>

        <div style="box-sizing: border-box; padding: 14px 22px; border-radius: 24px; background: #1C0F0D; border: 1px solid #3A2420; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 14px">
            <h2 style="margin: 0; font-size: 24px; font-weight: 400; flex-grow: 1">보정 설정</h2>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 18px; color: #C9B3AC; cursor: pointer">
              <input type="checkbox" id="sim-toggle" style="width: 18px; height: 18px; accent-color: #FFB21E; margin: 0">
              시뮬레이션
            </label>
            <button type="button" id="btn-quit" style="height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid #5A3A33; background: transparent; color: #B8A29B; font-family: inherit; font-size: 16px; cursor: pointer">앱 종료</button>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center" title="점수 = 세기 × 보정계수">
            <label class="field"><span>보정계수</span><input type="number" id="cal" step="0.01" min="0.001"></label>
            <label class="field"><span>채널</span><select id="emg-channel"><option value="1">1</option><option value="2">2</option></select></label>
          </div>
          <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center">
            <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
              <button type="button" id="btn-zero" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 2px solid #5A3A33; background: transparent; color: #F3E6E1; font-family: inherit; font-size: 20px; cursor: pointer; white-space: nowrap">영점 잡기</button>
              <div id="rest-text" style="font-size: 17px; color: #B8A29B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"></div>
            </div>
            <button type="button" id="btn-save-settings" style="height: 40px; min-width: 76px; padding: 0 12px; border-radius: 10px; border: 2px solid #FFB21E; background: transparent; color: #FFB21E; font-family: inherit; font-size: 20px; cursor: pointer">저장</button>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
<script src="segments.js"></script>
<script src="app.js"></script>
</body>
</html>
